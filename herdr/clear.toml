# Clear Light and Clear Dark for herdr (https://herdr.dev), generated by
# clear-theme's build.py. herdr switches between them with the terminal's
# appearance. Every color is set, so nothing falls back to the "terminal"
# base theme, which assumes a dark background.
[theme]
name = "terminal"
auto_switch = true

[theme.custom.light]
text = "#3a4851"
subtext0 = "#506573"       # secondary text: headers, hints, branch names
overlay0 = "#506573"
overlay1 = "#506573"
mauve = "#506573"
sidebar_bg = "reset"       # keep the window's translucent background
panel_bg = "#ffffff"       # tab bar, status line, popups; text on accent
active_row_bg = "#e5ecf1"  # current space/agent: the terminal's selection
selection_bg = "#e5ecf1"   # cursor row while navigating
surface0 = "#edefef"
surface1 = "#d0d3d5"       # dragged row, search matches, popup dividers
surface_dim = "#dfe2e3"    # divider lines
accent = "#1f7bbc"         # active tab, key hints
blue = "#487ba2"
green = "#448349"          # idle
yellow = "#8c7429"         # working
red = "#bf4e3d"            # blocked
teal = "#258184"           # done
peach = "#8c7429"          # interrupted

[theme.custom.dark]
text = "#e6e6e6"
subtext0 = "#b9babe"
overlay0 = "#b9babe"
overlay1 = "#b9babe"
mauve = "#b9babe"
sidebar_bg = "reset"
panel_bg = "#212734"
active_row_bg = "#334e5e"
selection_bg = "#334e5e"
surface0 = "#333844"
surface1 = "#50555f"
surface_dim = "#414650"
accent = "#67b5ed"
blue = "#67b5ed"
green = "#79be7e"
yellow = "#e5c872"
red = "#e79285"
teal = "#84dde0"
peach = "#e5c872"
