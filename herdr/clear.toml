# Clear Light and Clear Dark for herdr (https://herdr.dev), generated by
# clear-theme's build.py. herdr switches between them with the terminal's
# appearance. Every color is set, so nothing falls back to the "terminal"
# base theme, which assumes a dark background.
[theme]
name = "terminal"
auto_switch = true

[theme.custom.light]
text = "#3a4851"
subtext0 = "#506573"       # secondary text: headers, hints, branch names
overlay0 = "#506573"
overlay1 = "#506573"
mauve = "#506573"
sidebar_bg = "reset"       # keep the window's translucent background
panel_bg = "reset"         # tab bar, status line, popups: translucent too
active_row_bg = "#e5ecf1"  # current space/agent: the terminal's selection
selection_bg = "#e5ecf1"   # cursor row while navigating
surface0 = "#edefef"
surface1 = "#d0d3d5"       # dragged row, search matches, popup dividers
surface_dim = "#dfe2e3"    # divider lines; text on accent, as panel_bg is reset
accent = "#1a68a0"         # active tab, key hints
blue = "#427296"
green = "#3e7943"          # idle
yellow = "#816a26"         # working
red = "#b74b3b"            # blocked
teal = "#22777a"           # done
peach = "#816a26"          # interrupted

[theme.custom.dark]
text = "#e6e6e6"
subtext0 = "#b8babd"
overlay0 = "#b8babd"
overlay1 = "#b8babd"
mauve = "#b8babd"
sidebar_bg = "reset"
panel_bg = "reset"
active_row_bg = "#334e5e"
selection_bg = "#334e5e"
surface0 = "#333844"
surface1 = "#50555f"
surface_dim = "#414650"
accent = "#72bbee"
blue = "#67b5ed"
green = "#79be7e"
yellow = "#e5c872"
red = "#e79285"
teal = "#84dde0"
peach = "#e5c872"
